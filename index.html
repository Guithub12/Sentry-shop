    const ctx = canvas.getContext('2d');
    let particles = [];

    function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.15;
            this.speedY = (Math.random() - 0.5) * 0.15;
            this.opacity = Math.random() * 0.5 + 0.3;
            this.pulseSpeed = Math.random() * 0.02 + 0.01;
            this.pulsePhase = Math.random() * Math.PI * 2;
        }
        
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x > canvas.width) this.x = 0;
            if (this.x < 0) this.x = canvas.width;
            if (this.y > canvas.height) this.y = 0;
            if (this.y < 0) this.y = canvas.height;
            this.pulsePhase += this.pulseSpeed;
        }
        
        draw() {
            const pulse = Math.sin(this.pulsePhase) * 0.3 + 0.7;
            const currentOpacity = this.opacity * pulse;
            const currentSize = this.size * pulse;
            const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, currentSize * 8);
            gradient.addColorStop(0, `rgba(255, 255, 255, ${currentOpacity * 0.8})`);
            gradient.addColorStop(0.2, `rgba(255, 255, 255, ${currentOpacity * 0.3})`);
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(this.x, this.y, currentSize * 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = `rgba(255, 255, 255, ${currentOpacity})`;
            ctx.shadowBlur = 15;
            ctx.shadowColor = 'white';
            ctx.beginPath();
            ctx.arc(this.x, this.y, currentSize, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function createParticles() {
        particles = []; 
        const particleCount = Math.floor((canvas.width * canvas.height) / 8000);
        for (let i = 0; i < Math.max(particleCount, 100); i++) {
            particles.push(new Particle());
        }
    }

    function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animateStars);
    }

                        <div class="price-features">
                            <div class="price-feature">AES-256-GCM encrypted communication channel</div>
                            <div class="price-feature">App-Bound Encryption bypass (updated Chrome instances)</div>
                            <div class="price-feature">Survives Windows resets & reinstallations (if Secure Boot disabled)</div>
                            <div class="price-feature">Full browser credential & cookie extraction</div>
                            <div class="price-feature">Cryptocurrency wallet harvesting</div>
                            <div class="price-feature">Lifetime updates & dedicated support</div>
                        </div>
                        <button class="btn-action" onclick="openPortal()" style="margin-top: 20px;">Purchase Stealer</button>
                    </div>
                </div>
            </div>
        `;
    }

    // State management
    let currentProduct = 'rat';

    function updatePage(product) {
        currentProduct = product;
        if (product === 'rat') {
            appRoot.innerHTML = renderRatPage();
        } else if (product === 'stealer') {
            appRoot.innerHTML = renderStealerPage();
        }
        
        // Re-bind navigation and buttons after content update
        setTimeout(() => {
            // Bind all btn-action to modal
            document.querySelectorAll('.btn-action').forEach(btn => {
                if (!btn.getAttribute('data-bound')) {
                    btn.setAttribute('data-bound', 'true');
                    btn.onclick = (e) => { openPortal(); };
                }
            });
            
            // Smooth scroll for anchor links
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    if (href && href !== '#') {
                        e.preventDefault();
                        const targetId = href.substring(1);
                        const target = document.getElementById(targetId);
                        if (target) target.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });
        }, 20);
    }

    // Navigation handlers
    function initNavigation() {
        const ratLink = document.querySelector('.dropdown-item[data-product="rat"]');
        const stealerLink = document.querySelector('.dropdown-item[data-product="stealer"]');
        
        if (ratLink) {
            ratLink.addEventListener('click', (e) => {
                e.preventDefault();
                updatePage('rat');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
        if (stealerLink) {
            stealerLink.addEventListener('click', (e) => {
                e.preventDefault();
                updatePage('stealer');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
        
        // Buy button nav
        const buyNav = document.querySelector('.nav-btn[data-product="rat"]');
        if (buyNav) {
            buyNav.addEventListener('click', (e) => {
                e.preventDefault();
                if (currentProduct !== 'rat') {
                    updatePage('rat');
                }
                setTimeout(() => {
                    document.getElementById('top')?.scrollIntoView({ behavior: 'smooth' });
                }, 50);
            });
        }
        
        // About Us and Prices smooth scroll
        const aboutNav = document.querySelector('a.nav-btn[href="#about"]');
        const pricesNav = document.querySelector('a.nav-btn[href="#pricing"]');
        if (aboutNav) {
            aboutNav.addEventListener('click', (e) => {
                e.preventDefault();
                const aboutEl = document.getElementById('about');
                if (aboutEl) aboutEl.scrollIntoView({ behavior: 'smooth' });
            });
        }
        if (pricesNav) {
            pricesNav.addEventListener('click', (e) => {
                e.preventDefault();
                const pricingEl = document.getElementById('pricing');
                if (pricingEl) pricingEl.scrollIntoView({ behavior: 'smooth' });
            });
        }
    }

    // Initial render
    updatePage('rat');
    setTimeout(initNavigation, 100);
    
    // Mutation observer for dynamically added buttons
    const observer = new MutationObserver(() => {
        document.querySelectorAll('.btn-action').forEach(btn => {
            if (!btn.getAttribute('data-bound')) {
                btn.setAttribute('data-bound', 'true');
                btn.onclick = (e) => { openPortal(); };
            }
        });
    });
    observer.observe(appRoot, { childList: true, subtree: true });
</script>
